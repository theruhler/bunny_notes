name: Deploy Bunny Notes iPhone App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Prepare site
        run: |
          mkdir -p site
          cat > site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta http-equiv="refresh" content="0; url=./iphone-web/" />
              <title>Bunny Notes</title>
            </head>
            <body>
              <p>Redirecting to <a href="./iphone-web/">Bunny Notes</a>...</p>
            </body>
          </html>
          EOF
          mkdir -p site/iphone-web
          cp -R iphone-web/. site/iphone-web/
          cp bunny1.png site/bunny1.png
          mkdir -p site/assets
          cp -R assets/. site/assets/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
